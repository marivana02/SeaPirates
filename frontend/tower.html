<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>SeaPirate — Günlük Kule</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Premium Styling using Gold and Wood themes */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c8962a; --gold-b: #f0c040; --gold-p: #fde68a;
      --wood-d: #1a0e05; --wood-m: #2d1a08;
      --txt: #f5e6c8; --txt-d: #b8956a;
    }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: #071428 url('assets/sea.png') repeat;
      background-size: 200px auto;
      font-family: 'Inter', sans-serif;
      color: var(--txt); user-select: none;
    }
    .page {
      max-width: 430px; margin: 0 auto; height: 100dvh;
      display: flex; flex-direction: column; position: relative;
      background: rgba(0, 0, 0, 0.55);
    }
    .header {
      position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: linear-gradient(180deg, rgba(5,2,0,0.9) 0%, transparent 100%);
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: linear-gradient(180deg, #3d2108, #1e0e03);
      border: 1px solid var(--gold); border-radius: 6px;
      font-family: 'Cinzel', serif; font-size: 0.72rem; font-weight: 700; color: var(--gold-p);
      cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .back-btn:hover { border-color: var(--gold-b); box-shadow: 0 0 8px rgba(200, 150, 42, 0.45); }
    .title-wrap {
      font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 900; color: var(--gold-b);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(200, 150, 42, 0.35); letter-spacing: 0.05em;
    }
    .content {
      flex: 1; overflow-y: auto; padding: 10px 16px 20px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .info-banner {
      background: rgba(20, 10, 5, 0.85); border: 1px solid var(--gold); border-radius: 8px;
      padding: 12px; margin-bottom: 24px; text-align: center;
      font-size: 0.78rem; color: var(--txt-d); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      line-height: 1.4;
    }
    .info-banner.locked {
      border-color: #e74c3c; color: #ffd0c0; background: rgba(40, 10, 5, 0.85);
    }
    .target-title {
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; color: var(--gold-p);
      text-transform: uppercase; text-align: center; margin-bottom: 12px; letter-spacing: 0.1em;
    }
    .tower-card {
      background: linear-gradient(135deg, #25160b 0%, #0d0602 100%);
      border: 2px solid var(--gold); border-radius: 12px; padding: 20px;
      display: flex; flex-direction: column; position: relative; overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 15px rgba(200, 150, 42, 0.15);
      text-align: center; align-items: center;
    }
    .tower-card.locked { opacity: 0.65; filter: grayscale(0.5); }
    .t-icon-wrap {
      width: 140px; height: 140px; margin: 10px 0 20px;
      background: radial-gradient(circle, rgba(120,95,50,0.4) 0%, rgba(12,6,3,0.98) 100%);
      border: 1px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 15px rgba(200,150,42,0.3), 0 4px 12px rgba(0,0,0,0.5);
    }
    .t-icon-wrap img { width: 75%; height: 75%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.85)); }
    .t-name { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 800; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 6px; }
    .t-diff { font-size: 0.65rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; display: inline-block; margin-bottom: 16px; text-transform: uppercase; }
    .diff-low { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #27ae60; }
    .diff-mid { background: rgba(243, 156, 18, 0.2); color: #f1c40f; border: 1px solid #f39c12; }
    .diff-hard { background: rgba(192, 57, 43, 0.2); color: #e74c3c; border: 1px solid #c0392b; }
    .t-stats {
      width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      background: rgba(0,0,0,0.4); border-radius: 8px; padding: 12px; margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .t-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--txt-d); }
    .t-stat span { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .t-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .t-reward { font-size: 0.9rem; font-weight: 700; color: #b8f0e8; display: flex; align-items: center; gap: 6px; }
    .t-reward img { width: 18px; height: 18px; }
    .btn-attack {
      width: 100%; max-width: 240px;
      background: linear-gradient(180deg, #a02020 0%, #6a0e0e 100%);
      border: 1px solid #c0392b; border-radius: 8px; color: #fde6c8; font-family: 'Cinzel', serif;
      font-size: 0.95rem; font-weight: 700; padding: 12px 24px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,200,150,0.15); text-shadow: 0 1px 2px #000;
      transition: all 0.15s;
    }
    .btn-attack:hover { background: linear-gradient(180deg, #c0392b 0%, #8a1010 100%); border-color: #e05040; }
    .btn-attack:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .btn-attack:disabled { background: #444 !important; border-color: #333 !important; color: #777 !important; cursor: not-allowed; box-shadow: none !important; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <a href="map.html" class="back-btn">
        <img src="assets/ikon/images/195_ico_safehaven.png" style="width:14px;height:14px;object-fit:contain;vertical-align:middle;filter:brightness(1.1);" />
        GERİ
      </a>
      <div class="title-wrap">GÜNLÜK KULE</div>
      <div style="width:70px;"></div>
    </div>
    
    <div class="content">
      <div class="info-banner" id="status-banner">
        Kule verileri yükleniyor...
      </div>
      
      <div class="target-title">BUGÜNKÜ HEDEFİNİZ</div>
      <div id="tower-container">
        <!-- JS rendered -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    const token = localStorage.getItem('sp_token');
    if (!token) window.location.href = 'index.html';

    const TOWERS = {
      1: { id: 1, name: 'Liman Karakolu', lvl: 1, diff: 'KOLAY', cls: 'diff-low', hp: 25000, dmg: 600, pearl: 300, img: 'assets/tower/low1.png' },
      2: { id: 2, name: 'Korsan Sığınağı', lvl: 2, diff: 'KOLAY', cls: 'diff-low', hp: 55000, dmg: 1300, pearl: 700, img: 'assets/tower/low3.png' },
      3: { id: 3, name: 'Deniz Muhafızı', lvl: 3, diff: 'ORTA', cls: 'diff-mid', hp: 110000, dmg: 2500, pearl: 1500, img: 'assets/tower/middle1.png' },
      4: { id: 4, name: 'Hisar Kalesi', lvl: 4, diff: 'ORTA', cls: 'diff-mid', hp: 220000, dmg: 4800, pearl: 3200, img: 'assets/tower/middle3.png' },
      5: { id: 5, name: 'Kraliyet Tabyası', lvl: 5, diff: 'ZOR', cls: 'diff-hard', hp: 450000, dmg: 8500, pearl: 7000, img: 'assets/tower/hard1.png' }
    };

    function fmt(n) { return Number(n).toLocaleString('tr-TR'); }

    async function init() {
      try {
        const res = await fetch(`${API_URL}/player/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to fetch player data');
        const data = await res.json();
        
        const pLvl = data.level || 1;
        const towerLvl = data.tower_level || 1;
        
        let levelLocked = pLvl < 5;

        let dailyLocked = false;
        if (data.last_tower_attack) {
          const lastDate = new Date(data.last_tower_attack).toISOString().split('T')[0];
          const todayDate = new Date().toISOString().split('T')[0];
          if (lastDate === todayDate) dailyLocked = true;
        }

        let name = '';
        let diff = '';
        let cls = '';
        let img = '';
        let calculatedTowerId = 1;

        if (towerLvl <= 25) {
          name = 'Liman Karakolu';
          diff = 'KOLAY';
          cls = 'diff-low';
          img = 'assets/tower/low1.png';
          calculatedTowerId = 1;
        } else if (towerLvl <= 50) {
          name = 'Korsan Sığınağı';
          diff = 'KOLAY';
          cls = 'diff-low';
          img = 'assets/tower/low3.png';
          calculatedTowerId = 2;
        } else if (towerLvl <= 75) {
          name = 'Deniz Muhafızı';
          diff = 'ORTA';
          cls = 'diff-mid';
          img = 'assets/tower/middle1.png';
          calculatedTowerId = 3;
        } else if (towerLvl <= 100) {
          name = 'Hisar Kalesi';
          diff = 'ORTA';
          cls = 'diff-mid';
          img = 'assets/tower/middle3.png';
          calculatedTowerId = 4;
        } else {
          name = 'Kraliyet Tabyası';
          diff = 'ZOR';
          cls = 'diff-hard';
          img = 'assets/tower/hard1.png';
          calculatedTowerId = 5;
        }

        const hp = 20000 + ((towerLvl - 1) * 8000);
        const dmg = 400 + ((towerLvl - 1) * 120);
        const pearl = 150 + (towerLvl * 50);

        const banner = document.getElementById('status-banner');
        if (levelLocked) {
          banner.className = 'info-banner locked';
          banner.innerHTML = `⚠️ Kule Savaşlarına katılabilmek için en az <b>Seviye 5 (Lvl 5)</b> olmalısınız!<br>Mevcut Seviyeniz: Lvl ${pLvl}`;
        } else if (dailyLocked) {
          banner.className = 'info-banner locked';
          banner.innerHTML = `⚠️ Günlük kule savaşı hakkınızı bugün kullandınız.<br>Bir sonraki kuleyi (<b>Lvl ${towerLvl}</b>) yarın test edebilirsiniz!`;
        } else {
          banner.className = 'info-banner';
          banner.innerHTML = `Kule seviyeniz <b>Lvl ${towerLvl}</b> olarak belirlendi.<br>Günde sadece 1 kez saldırabilirsiniz!`;
        }

        const container = document.getElementById('tower-container');
        const disableBtn = levelLocked || dailyLocked;

        container.innerHTML = `
          <div class="tower-card ${disableBtn ? 'locked' : ''}">
            <div class="t-name">${name} (Lvl ${towerLvl})</div>
            
            <div class="t-icon-wrap">
              <img src="${img}" alt="${name}" />
            </div>
            
            <div class="t-stats">
              <div class="t-stat">🛡️ Maksimum HP <span style="color:#2ecc71;">${fmt(hp)}</span></div>
              <div class="t-stat">⚔️ Kule Hasarı <span style="color:#e74c3c;">${fmt(dmg)}</span></div>
            </div>
            
            <div class="t-bottom">
              <div style="font-size:0.7rem; color:var(--txt-d);">Kazanılacak Ödül:</div>
              <div class="t-reward"><img src="assets/pearl.png" /> +${fmt(pearl)} İnci</div>
              <button class="btn-attack" ${disableBtn ? 'disabled' : ''} onclick="attackTower(${calculatedTowerId})">⚔ SALDIRIYA BAŞLA</button>
            </div>
          </div>
        `;

      } catch (err) {
        console.error(err);
      }
    }

    function attackTower(id) {
      localStorage.setItem('sp_combat_is_tower', 'true');
      localStorage.setItem('sp_combat_tower_id', id);
      window.location.href = 'fight.html';
    }

    init();
  </script>
</body>
</html>
