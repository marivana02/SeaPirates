<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>SeaPirates — Pırıltı Denizi</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #c8962a;
      --gold-b: #f0c040;
      --gold-p: #fde68a;
      --wood-d: #1a0e05;
      --wood-m: #2d1a08;
      --wood-plank: #5c3518;
      --txt: #f5e6c8;
      --txt-d: #b8956a;
      --txt-m: #7a5a38;
      --red: #c0392b;
      --red-b: #e74c3c;
      --hp-green: #27ae60;
    }

    html,
    body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #071428;
      font-family: 'Inter', sans-serif;
      color: var(--txt);
      user-select: none;
    }

    /* ── PAGE LAYOUT ── */
    .page {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('assets/sea.png') repeat;
      background-size: 200px auto;
    }

    /* ── HEADER ── */
    .glitter-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(5, 2, 0, 0.9) 0%, transparent 100%);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: linear-gradient(180deg, #3d2108, #1e0e03);
      border: 1px solid var(--gold);
      border-radius: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold-p);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover {
      border-color: var(--gold-b);
      box-shadow: 0 0 8px rgba(200, 150, 42, 0.45);
    }

    .title-wrap {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 900;
      color: var(--gold-b);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(200, 150, 42, 0.35);
      letter-spacing: 0.08em;
    }

    /* ── SEA AREA ── */
    .sea-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .sea-water-effect {
      position: absolute;
      inset: 0;
      background: rgba(5, 2, 0, 0.15);
      pointer-events: none;
    }

    /* Pırıltı ve Ödül CSS */
    .glitter-item {
      position: absolute;
      width: 42px;
      height: 42px;
      cursor: pointer;
      z-index: 2;
      transform: translate(-50%, -50%);
      transition: transform 0.2s ease, opacity 0.3s ease;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(255,255,255,0.75));
    }
    .glitter-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .glitter-item:hover {
      transform: translate(-50%, -50%) scale(1.22);
    }
    .glitter-item.collecting {
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }

    /* Glitter Bottom Rewards Panel */
    .glitter-panel {
      flex-shrink: 0;
      margin: 0 10px 6px;
      background: rgba(15, 8, 3, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #7a4a18;
      border-radius: 8px;
      padding: 7px 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9;
      font-size: 0.72rem;
      color: var(--txt-d);
      position: relative;
    }
    .glitter-panel-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold-p);
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .glitter-rewards-list {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--txt);
      font-weight: 600;
    }
    .glitter-reward-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .glitter-reward-item img {
      width: 14px;
      height: 14px;
      object-fit: contain;
    }
    .glitter-empty-txt {
      font-style: italic;
      color: var(--txt-m);
      font-size: 0.65rem;
    }

    /* Float Up Animation */
    @keyframes floatUp {
      0% {
        transform: translate(-50%, -50%) translateY(0);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) translateY(-70px);
        opacity: 0;
      }
    }

    /* ── PLAYER PANEL (Bottom) ── */
    .player-panel {
      flex-shrink: 0;
      margin: 0 10px 10px;
      background: linear-gradient(135deg, #180d04 0%, #0d0602 100%);
      border: 1px solid var(--gold);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 5;
    }

    .pinfo-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(200, 150, 42, 0.15);
      position: relative;
    }
    .pinfo-top::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(5, 2, 0, 0.5);
      pointer-events: none;
    }

    .p-rank-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(200, 150, 42, 0.6);
      background: radial-gradient(circle, rgba(120, 95, 50, 0.45) 0%, rgba(12, 6, 3, 0.98) 100%);
      flex-shrink: 0;
      box-shadow: inset 0 0 6px rgba(200, 150, 42, 0.25), 0 0 6px rgba(200, 150, 42, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      position: relative;
      z-index: 1;
    }
    .p-rank-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 3px rgba(200, 150, 42, 0.35)) brightness(1.22) contrast(1.1);
    }

    .p-name-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .p-name {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--txt);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hp-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .hp-track {
      flex: 1;
      height: 14px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #5a3a15;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #27ae60, #2ecc71);
      transition: width 0.3s, background 0.3s;
    }
    .hp-txt {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px #000;
      white-space: nowrap;
    }

    .pinfo-body {
      position: relative;
      display: flex;
      background: rgba(0, 0, 0, 0.3);
    }
    .pinfo-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(5, 2, 0, 0.55);
      pointer-events: none;
      z-index: 0;
    }

    .p-stats {
      flex: 1;
      position: relative;
      z-index: 1;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
    }
    .s-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .s-icon {
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .s-val {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--txt);
    }
    .s-val.gc { color: var(--gold-b); }
    .s-val.pc { color: #b8f0e8; }
    
    .s-key {
      font-size: 0.6rem;
      color: var(--txt-m);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .lvl-row {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      gap: 7px;
      padding-top: 2px;
    }
    .lvl-lbl {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--txt-d);
      white-space: nowrap;
    }
    .lvl-track {
      flex: 1;
      height: 14px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #5a3a15;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .lvl-fill {
      height: 100%;
      background: linear-gradient(90deg, #154360, #2980b9);
      transition: width .5s ease;
    }
    .lvl-pct {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px #000;
      white-space: nowrap;
    }

    /* TOAST */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-70px);
      z-index: 9999;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok {
      background: rgba(25, 70, 40, 0.95);
      border: 1px solid #27ae60;
      color: #c8f0d8;
    }
    .toast.err {
      background: rgba(80, 20, 10, 0.95);
      border: 1px solid #e05a3a;
      color: #ffd0c0;
    }
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>

  <div class="page">
    <!-- GLITTER HEADER -->
    <div class="glitter-header">
      <a href="map.html" class="back-btn">
        <img src="assets/ikon/images/195_ico_safehaven.png" style="width:14px;height:14px;object-fit:contain;vertical-align:middle;filter:brightness(1.1);" />
        HARİTAYA DÖN
      </a>
      <div class="title-wrap">PIRILTI</div>
      <div style="width:90px;"></div> <!-- Dengelemek için boşluk -->
    </div>

    <!-- SEA AREA -->
    <div class="sea-area">
      <div class="sea-water-effect"></div>
    </div>

    <!-- GLITTER REWARDS PANEL -->
    <div class="glitter-panel" id="glitter-panel">
      <div class="glitter-panel-title">✨ Ödül:</div>
      <div class="glitter-rewards-list" id="glitter-rewards-list">
        <span class="glitter-empty-txt">Denizden pırıltı toplayarak ödüller kazanın!</span>
      </div>
    </div>

    <!-- PLAYER PANEL -->
    <div class="player-panel">
      <div class="pinfo-top">
        <div class="p-rank-icon" id="p-rank-icon">☠</div>
        <div class="p-name-wrap">
          <span class="p-name" id="p-name">Kaptan...</span>
          <div class="hp-row">
            <div class="hp-track">
              <div class="hp-fill" id="p-hp-fill" style="width:100%"></div>
              <span class="hp-txt" id="p-hp-txt">0 / 0</span>
            </div>
          </div>
        </div>
      </div>
      <div class="pinfo-body">
        <div class="p-stats">
          <div class="s-row">
            <span class="s-icon"><img src="assets/pearl.png" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;"></span>
            <span class="s-val pc" id="p-pearl">0</span>
          </div>
          <div class="s-row">
            <span class="s-icon"><img src="assets/gold.png" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;"></span>
            <span class="s-val gc" id="p-gold">0</span>
          </div>
          <div class="s-row">
            <span class="s-key">XP:</span>
            <span class="s-val" id="p-xp">0</span>
          </div>
          <div class="s-row">
            <span class="s-key">ELP:</span>
            <span class="s-val" id="p-elp">0</span>
          </div>
          <div class="lvl-row">
            <span class="lvl-lbl" id="p-lvl">1 LVL</span>
            <div class="lvl-track">
              <div class="lvl-fill" id="p-lvl-fill" style="width:0%"></div>
              <span class="lvl-pct" id="p-lvl-pct">0 / 0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    const token = localStorage.getItem('sp_token');

    if (!token) {
      window.location.href = 'index.html';
    }

    let player = {};

    function fmt(n) { return Number(n).toLocaleString('tr-TR'); }

    function hpColor(pct) {
      if (pct > 60) return 'linear-gradient(90deg,#1a7a2e,#27ae60,#2ecc71)';
      if (pct > 30) return 'linear-gradient(90deg,#7a5a00,#e6a817,#f1c40f)';
      if (pct > 15) return 'linear-gradient(90deg,#7a2500,#e05010,#e67e22)';
      return 'linear-gradient(90deg,#7a0a0a,#c0392b,#e74c3c)';
    }

    // Modernize edilmiş toast bildirimleri
    function toast2(msg, type = 'ok') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    async function fetchPlayerData() {
      try {
        const res = await fetch(`${API_URL}/player/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          player = {
            name: data.username,
            level: data.level,
            xp: data.xp,
            xpNext: data.xpNext,
            gold: data.gold,
            pearl: data.pearl,
            elp: data.elite_points,
            hp: data.hp,
            hpMax: data.max_hp,
            rankBadge: data.rankBadge,
            rankName: data.rankName
          };
          initPlayerUI();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function initPlayerUI() {
      document.getElementById('p-name').textContent = player.name;

      const rankIconEl = document.getElementById('p-rank-icon');
      if (rankIconEl) {
        rankIconEl.innerHTML = `<img src="assets/rank/rank${player.rankBadge || 13}.png" style="width: 100%; height: 100%; object-fit: contain;" alt="${player.rankName || 'Kara Adamı'}" title="${player.rankName || 'Kara Adamı'}">`;
      }

      document.getElementById('p-pearl').textContent = fmt(player.pearl);
      document.getElementById('p-gold').textContent = fmt(player.gold);
      document.getElementById('p-xp').textContent = fmt(player.xp);
      document.getElementById('p-elp').textContent = fmt(player.elp);
      document.getElementById('p-lvl').textContent = player.level + ' LVL';
      document.getElementById('p-lvl-pct').textContent = fmt(player.xp) + ' / ' + fmt(player.xpNext);

      const xpPct = Math.min(100, (player.xp / player.xpNext) * 100);
      document.getElementById('p-lvl-fill').style.width = xpPct + '%';

      const hpPct = Math.min(100, Math.max(0, (player.hp / player.hpMax) * 100));
      const hpFill = document.getElementById('p-hp-fill');
      hpFill.style.width = hpPct + '%';
      hpFill.style.background = hpColor(hpPct);
      document.getElementById('p-hp-txt').textContent = fmt(player.hp) + ' / ' + fmt(player.hpMax);
    }

    function updatePlayerUI(data) {
      player.gold = data.gold;
      player.pearl = data.pearl;
      player.xp = data.xp;
      player.level = data.level;
      player.xpNext = data.xpNext;
      
      document.getElementById('p-gold').textContent = fmt(player.gold);
      document.getElementById('p-pearl').textContent = fmt(player.pearl);
      document.getElementById('p-xp').textContent = fmt(player.xp);
      document.getElementById('p-lvl').textContent = player.level + ' LVL';
      document.getElementById('p-lvl-pct').textContent = fmt(player.xp) + ' / ' + fmt(player.xpNext);

      const xpPct = Math.min(100, (player.xp / player.xpNext) * 100);
      document.getElementById('p-lvl-fill').style.width = xpPct + '%';
    }

    // PIRILTI SPARK ENGINE
    (function() {
      const seaArea = document.querySelector('.sea-area');
      const maxGlitters = 4;
      let activeGlitters = [];

      function startGlitterLoop() {
        const interval = Math.random() * 1500 + 2000; // 2000ms - 3500ms
        setTimeout(() => {
          if (activeGlitters.length < maxGlitters) {
            spawnGlitter();
          }
          startGlitterLoop();
        }, interval);
      }

      function spawnGlitter() {
        const div = document.createElement('div');
        div.className = 'glitter-item';
        
        const leftPercent = Math.random() * 80 + 10; // %10 - %90 arası
        const topPercent = Math.random() * 60 + 20;  // %20 - %80 arası
        
        div.style.left = `${leftPercent}%`;
        div.style.top = `${topPercent}%`;
        
        const img = document.createElement('img');
        div.appendChild(img);
        seaArea.appendChild(div);
        activeGlitters.push(div);

        let frame = 1;
        img.src = `assets/pırıltı/${frame}.png`;
        const animInterval = setInterval(() => {
          frame++;
          if (frame > 22) frame = 1;
          img.src = `assets/pırıltı/${frame}.png`;
        }, 80);

        const selfDestruct = setTimeout(() => {
          clearInterval(animInterval);
          removeGlitter(div);
        }, 15000);

        div.onclick = async (e) => {
          e.stopPropagation();
          clearTimeout(selfDestruct);
          clearInterval(animInterval);
          div.classList.add('collecting');

          try {
            const res = await fetch(`${API_URL}/player/glitter/collect`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              }
            });
            const data = await res.json();
            if (res.ok) {
              renderGlitterRewards(data.rewards);
              createFloatText(data.rewards, div.offsetLeft, div.offsetTop);
              updatePlayerUI(data.player);
              
              if (data.leveledUp) {
                toast2(`🎉 SEVİYE ATLADIN! → ${data.newLevel} LVL`, 'ok');
              }
            } else {
              toast2(data.error || 'Pırıltı toplanamadı.', 'err');
            }
          } catch (err) {
            console.error(err);
          } finally {
            removeGlitter(div);
          }
        };
      }

      function removeGlitter(el) {
        activeGlitters = activeGlitters.filter(g => g !== el);
        if (el.parentNode) el.parentNode.removeChild(el);
      }

      // Sadece kazanılan tekil ödülü yüzen metin olarak gösterme
      function createFloatText(rewards, x, y) {
        const tag = document.createElement('div');
        tag.style.cssText = `
          position: absolute;
          left: ${x}px;
          top: ${y}px;
          transform: translate(-50%, -50%);
          font-family: 'Cinzel', serif;
          font-size: 0.78rem;
          font-weight: 900;
          color: #fde68a;
          text-shadow: 0 2px 5px #000, 0 0 8px #c8962a;
          z-index: 100;
          pointer-events: none;
          display: flex;
          flex-direction: column;
          gap: 2px;
          align-items: center;
          animation: floatUp 1.3s ease-out forwards;
        `;
        
        let html = '';
        if (rewards.gold > 0) {
          html = `<div style="display: flex; align-items: center; gap: 4px;"><img src="assets/gold.png" style="width: 14px; height: 14px; object-fit: contain; vertical-align: middle;"> +${fmt(rewards.gold)} Altın</div>`;
        } else if (rewards.pearl > 0) {
          html = `<div style="display: flex; align-items: center; gap: 4px; color:#b8f0e8;"><img src="assets/pearl.png" style="width: 14px; height: 14px; object-fit: contain; vertical-align: middle;"> +${fmt(rewards.pearl)} İnci</div>`;
        } else if (rewards.xp > 0) {
          html = `<div style="color:#a4b0be;">+${fmt(rewards.xp)} XP</div>`;
        } else if (rewards.ammo) {
          html = `<div style="display: flex; align-items: center; gap: 4px; color:#3498db;">💣 +${rewards.ammo.qty} ${rewards.ammo.name}</div>`;
        }
        
        tag.innerHTML = html;
        seaArea.appendChild(tag);
        
        setTimeout(() => tag.remove(), 1300);
      }

      // Sadece kazanılan tekil ödülü alt ödül panelinde render etme
      function renderGlitterRewards(rewards) {
        const list = document.getElementById('glitter-rewards-list');
        let html = '';
        
        if (rewards.gold > 0) {
          html = `
            <span class="glitter-reward-item" style="color:var(--gold-b);">
              <img src="assets/gold.png" alt="Altın"> +${fmt(rewards.gold)}
            </span>
          `;
        } else if (rewards.pearl > 0) {
          html = `
            <span class="glitter-reward-item" style="color:#b8f0e8;">
              <img src="assets/pearl.png" alt="İnci"> +${fmt(rewards.pearl)}
            </span>
          `;
        } else if (rewards.xp > 0) {
          html = `
            <span class="glitter-reward-item" style="color:#a4b0be;">
              +${fmt(rewards.xp)} XP
            </span>
          `;
        } else if (rewards.ammo) {
          html = `
            <span class="glitter-reward-item" style="color:#3498db;">
              💣 +${rewards.ammo.qty} ${rewards.ammo.name}
            </span>
          `;
        }
        
        list.innerHTML = html;
      }

      // Başlat
      startGlitterLoop();
    })();

    // İlk Yükleme
    fetchPlayerData();
  </script>
