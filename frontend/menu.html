<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>SeaPirates — Menü</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --gold: #c8962a;
      --gold-b: #f0c040;
      --gold-p: #fde68a;
      --wood-d: #1a0e05;
      --wood-m: #2d1a08;
      --wood-plank: #5c3518;
      --txt: #f5e6c8;
      --txt-d: #b8956a;
      --txt-m: #7a5a38;
      --red: #c0392b;
      --red-b: #e74c3c;
    }

    html,
    body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0d0702;
      font-family: 'Inter', sans-serif;
      color: var(--txt);
    }

    /* PAGE */
    .page {
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('assets/background/menubackground.png') center center / cover no-repeat;
    }

    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      /* Arka planı biraz karartarak menü öğelerini öne çıkar */
      pointer-events: none;
      z-index: 0;
    }

    /* TOP BAR */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(200, 150, 42, 0.3);
      background: linear-gradient(180deg, rgba(20, 10, 2, 0.95), rgba(10, 5, 0, 0.85));
    }

    .btn-back {
      padding: 8px 12px;
      background: linear-gradient(180deg, #3d2108, #1e0e03);
      border: 1px solid #7a4a18;
      border-radius: 7px;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--txt-d);
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .btn-back:hover {
      border-color: var(--gold);
      color: var(--gold-b);
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: var(--gold-b);
      text-shadow: 0 0 10px rgba(200, 150, 42, 0.6);
      text-transform: uppercase;
    }

    /* MENU GRID */
    .menu-wrap {
      flex: 1;
      position: relative;
      z-index: 5;
      padding: 20px 15px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      align-content: center;
      margin: 0 auto;
      width: 100%;
      max-width: 400px;
    }

    /* MENU BUTTON (WOODEN PLANK STYLE) */
    .menu-btn {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 18px 20px;
      background: url('assets/leaderboardbackground.png') center/cover;
      border: 2px solid #6a4218;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(20, 10, 0, 0.4);
      border-radius: 10px;
      transition: background 0.2s;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 8px 25px rgba(200, 150, 42, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .menu-btn:hover::before {
      background: rgba(200, 150, 42, 0.1);
    }

    .menu-lbl {
      position: relative;
      z-index: 1;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--txt);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .menu-btn:hover .menu-lbl {
      color: var(--gold-p);
    }

    /* TOAST */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-70px);
      z-index: 9999;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.ok {
      background: rgba(25, 70, 40, 0.95);
      border: 1px solid #27ae60;
      color: #c8f0d8;
    }
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>
  <div class="page">

    <!-- TOP BAR -->
    <div class="top-bar">
      <a href="home.html" class="btn-back">◀ LİMANA DÖN</a>
      <div class="page-title">MENÜ</div>
      <div style="width:85px;"></div> <!-- Denge için boş div -->
    </div>

    <!-- MENU LIST -->
    <div class="menu-wrap">

      <a href="shop.html" class="menu-btn">
        <span class="menu-lbl">Dükkan</span>
      </a>

      <a href="equipment.html" class="menu-btn">
        <span class="menu-lbl">Ekipman</span>
      </a>

      <a href="ships.html" class="menu-btn">
        <span class="menu-lbl">Gemiler</span>
      </a>

      <a href="auction.html" class="menu-btn">
        <span class="menu-lbl">Açık Arttırma</span>
      </a>

      <a href="my-hall.html" class="menu-btn">
        <span class="menu-lbl">Şeref Salonum</span>
      </a>

      <a href="hall-of-fame.html" class="menu-btn">
        <span class="menu-lbl">Şeref Salonu</span>
      </a>

      <a href="daily-reward.html" class="menu-btn">
        <span class="menu-lbl">Günlük Giriş Ödülü</span>
      </a>

      <a href="level-bonus.html" class="menu-btn">
        <span class="menu-lbl">Seviye Bonusu</span>
      </a>

      <a href="clan.html" class="menu-btn" onclick="toastMsg('Klan yakında!', event)">
        <span class="menu-lbl">Klan</span>
      </a>

      <a href="settings.html" class="menu-btn">
        <span class="menu-lbl">Ayarlar</span>
      </a>

    </div>

  </div>

  <script>
    function toastMsg(msg, e) {
      if (e) e.preventDefault();
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ok';
      el.getBoundingClientRect();
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

  </script>
  <script src="transition.js"></script>
</body>

</html>
