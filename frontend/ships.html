<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>SeaPirates — Gemiler</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#c8962a;--gold-b:#f0c040;--gold-p:#fde68a;
      --wood-d:#0f0a05;--wood-m:#1a1108;
      --txt:#f5e6c8;--txt-d:#b8956a;--txt-m:#7a5a38;
    }
    html,body{
      width:100%;height:100dvh;overflow:hidden;
      background:#080502;font-family:'Inter',sans-serif;color:var(--txt);
    }
    .page{
      max-width:430px;margin:0 auto;height:100dvh;
      display:flex;flex-direction:column;position:relative;
      background:url('assets/background/menubackground.png') center/cover no-repeat;
    }
    .page::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.70);pointer-events:none;z-index:0;}

    /* ── TOP BAR ── */
    .top-bar{
      position:relative;z-index:10;flex-shrink:0;padding:14px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(200,150,42,0.3);
      background:linear-gradient(180deg,rgba(20,10,2,0.98),rgba(10,5,0,0.9));
    }
    .btn-back{
      padding:8px 12px;background:linear-gradient(180deg,#3d2108,#1e0e03);
      border:1px solid #7a4a18;border-radius:7px;
      font-family:'Cinzel',serif;font-size:0.7rem;font-weight:700;
      color:var(--txt-d);text-decoration:none;transition:all 0.2s;
    }
    .btn-back:hover{border-color:var(--gold);color:var(--gold-b);}
    .page-title{
      font-family:'Cinzel',serif;font-weight:900;font-size:1.1rem;
      letter-spacing:0.1em;color:var(--gold-b);
      text-shadow:0 0 12px rgba(200,150,42,0.7);text-transform:uppercase;
    }

    /* ── BODY ── */
    .body{flex:1;position:relative;z-index:5;display:flex;flex-direction:column;overflow:hidden;}

    /* ── EP PROGRESS BAR ── */
    .ep-section{
      flex-shrink:0;padding:12px 16px;
      background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(200,150,42,0.15);
    }
    .ep-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .ep-lbl{font-size:0.65rem;font-weight:600;color:var(--txt-m);text-transform:uppercase;letter-spacing:0.06em;}
    .ep-val{font-size:0.75rem;font-weight:700;color:var(--gold-b);}
    .ep-track{
      height:9px;background:rgba(0,0,0,0.6);border-radius:5px;overflow:hidden;
      border:1px solid rgba(200,150,42,0.15);
    }
    .ep-fill{
      height:100%;border-radius:4px;
      background:linear-gradient(90deg,#5c3518,var(--gold-b));
      transition:width 0.6s ease;
    }
    .ep-next{font-size:0.58rem;color:var(--txt-m);margin-top:4px;text-align:right;}

    /* ── ACTIVE SHIP BANNER ── */
    .active-banner{
      flex-shrink:0;margin:12px 14px;padding:14px;
      background:url('assets/background/shippanel.png') center/cover;
      border:2px solid var(--gold);border-radius:12px;
      display:flex;align-items:center;gap:14px;
      box-shadow:0 0 20px rgba(200,150,42,0.15), 0 6px 15px rgba(0,0,0,0.6);
      position:relative;overflow:hidden;
    }
    .active-banner::before{
      content:'KULLANILANIYOR';position:absolute;top:8px;right:10px;
      font-family:'Cinzel',serif;font-size:0.55rem;font-weight:700;
      color:var(--gold);letter-spacing:0.1em;opacity:0.7;
    }
    .ab-img{
      width:80px;height:80px;flex-shrink:0;
      background:rgba(0,0,0,0.3);border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(200,150,42,0.2);
      overflow:hidden;
    }
    .ab-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px #000);}
    .ab-info{flex:1;}
    .ab-name{font-family:'Cinzel',serif;font-size:1rem;font-weight:900;color:var(--gold-p);margin-bottom:2px;}
    .ab-level{font-size:0.65rem;color:var(--txt-m);margin-bottom:8px;}
    .ab-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
    .ab-stat{
      background:rgba(0,0,0,0.3);border-radius:5px;padding:5px 7px;
      display:flex;flex-direction:column;gap:1px;
    }
    .ab-stat-k{font-size:0.55rem;color:var(--txt-m);text-transform:uppercase;}
    .ab-stat-v{font-size:0.78rem;font-weight:700;color:var(--txt);}

    /* ── TAB BAR ── */
    .tab-bar{
      flex-shrink:0;display:flex;padding:0 14px;gap:8px;
      background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(200,150,42,0.12);
    }
    .tab-btn{
      padding:10px 16px;background:transparent;border:none;border-bottom:2px solid transparent;
      font-family:'Cinzel',serif;font-size:0.72rem;font-weight:700;
      color:var(--txt-m);cursor:pointer;transition:all 0.2s;
    }
    .tab-btn.active{color:var(--gold-b);border-bottom:2px solid var(--gold);}

    /* ── SHIP GRID ── */
    .ship-grid{
      flex:1;overflow-y:auto;padding:14px;
      display:grid;grid-template-columns:1fr 1fr;gap:10px;
      align-content:start;
    }
    .ship-grid::-webkit-scrollbar{width:4px;}
    .ship-grid::-webkit-scrollbar-thumb{background:#442a10;border-radius:2px;}

    .ship-card{
      border-radius:10px;padding:12px 10px;cursor:pointer;position:relative;
      background:url('assets/background/shippanel.png') center/cover;
      border:1.5px solid rgba(200,150,42,0.1);
      display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
      transition:all 0.2s;box-shadow:0 4px 10px rgba(0,0,0,0.5);
    }
    .ship-card:hover:not(.locked){
      border-color:rgba(200,150,42,0.5);
      box-shadow:0 6px 18px rgba(200,150,42,0.12);
      transform:translateY(-2px);
    }
    .ship-card.active-card{
      border-color:var(--gold);
      box-shadow:0 0 15px rgba(200,150,42,0.2),0 4px 10px rgba(0,0,0,0.5);
    }
    .ship-card.locked{opacity:0.5;cursor:default;}

    .card-img{
      width:70px;height:70px;
      background:rgba(0,0,0,0.3);border-radius:7px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(200,150,42,0.1);overflow:hidden;
    }
    .card-img img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 3px 8px #000) brightness(1.6) saturate(1.5) contrast(1.1);}
    .card-img .ph{font-size:1.5rem;font-weight:700;color:var(--gold);opacity:0.35;}

    .card-name{font-family:'Cinzel',serif;font-size:0.68rem;font-weight:700;color:var(--txt);line-height:1.2;}
    .card-stats{font-size:0.6rem;color:var(--txt-d);line-height:1.5;}

    .card-badge{
      padding:3px 10px;border-radius:4px;
      font-family:'Cinzel',serif;font-size:0.58rem;font-weight:700;
      display:inline-block;
    }
    .badge-active{background:var(--gold);color:#1a0e05;}
    .badge-unlock{background:rgba(200,150,42,0.1);border:1px solid rgba(200,150,42,0.3);color:var(--gold-b);}
    .badge-locked{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);color:var(--txt-m);}

    .lock-icon{
      position:absolute;top:8px;right:8px;font-size:0.9rem;opacity:0.6;
    }

    /* ── DESIGNS TAB (placeholder) ── */
    .designs-empty{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;color:var(--txt-m);padding:30px;
    }
    .designs-empty .de-ico{font-size:3.5rem;opacity:0.15;}
    .designs-empty .de-txt{font-family:'Cinzel',serif;font-size:0.75rem;text-align:center;opacity:0.5;}

    /* ── TOAST ── */
    .toast{
      position:fixed;top:14px;left:50%;
      transform:translateX(-50%) translateY(-70px);z-index:9999;
      padding:10px 20px;border-radius:10px;font-size:0.8rem;font-weight:600;white-space:nowrap;
      transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .toast.show{transform:translateX(-50%) translateY(0);}
    .toast.ok{background:rgba(25,70,40,0.97);border:1px solid #27ae60;color:#c8f0d8;}
    .toast.err{background:rgba(80,20,20,0.97);border:1px solid #c0392b;color:#f8d8d8;}
  </style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="page">
  <div class="top-bar">
    <a href="menu.html" class="btn-back">◀ GERİ</a>
    <div class="page-title">GEMİLER</div>
    <div style="width:65px;"></div>
  </div>

  <div class="body">
    <!-- EP Progress -->
    <div class="ep-section">
      <div class="ep-row">
        <span class="ep-lbl">💎 Elit Puan (ELP)</span>
        <span class="ep-val" id="ep-val">0</span>
      </div>
      <div class="ep-track"><div class="ep-fill" id="ep-fill" style="width:0%"></div></div>
      <div class="ep-next" id="ep-next">Sonraki: Elit I — 35.000 ELP gerekli</div>
    </div>

    <!-- Active Ship Banner -->
    <div class="active-banner" id="active-banner">
      <div class="ab-img"><img id="ab-img" src="" alt=""/></div>
      <div class="ab-info">
        <div class="ab-name" id="ab-name">—</div>
        <div class="ab-level" id="ab-level">Seviye 0</div>
        <div class="ab-stats">
          <div class="ab-stat"><span class="ab-stat-k">HP</span><span class="ab-stat-v" id="ab-hp">—</span></div>
          <div class="ab-stat"><span class="ab-stat-k">Top Yuvası</span><span class="ab-stat-v" id="ab-top">—</span></div>
          <div class="ab-stat"><span class="ab-stat-k">Direk Yuvası</span><span class="ab-stat-v" id="ab-direk">—</span></div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-elit" onclick="switchTab('elit')">ELİT GEMİLER</button>
      <button class="tab-btn" id="tab-tasarim" onclick="switchTab('tasarim')">TASARIMLAR</button>
    </div>

    <!-- Grid / Content -->
    <div id="tab-content" style="flex:1;overflow:hidden;display:flex;flex-direction:column;"></div>
  </div>
</div>

<script>
  /* ── GDD VERİSİ ── */
  const GEMILER = [
    { lv:0,  ad:'Başlangıç', hp:10000,  top:15, direk:5,  ep:0,       img:'assets/elitship/default/1.png' },
    { lv:1,  ad:'Elit I',    hp:25000,  top:30, direk:10, ep:35000,   img:'assets/elitship/elit1/images/1.png' },
    { lv:2,  ad:'Elit II',   hp:36000,  top:35, direk:12, ep:90000,   img:'assets/elitship/elit2/images/1.png' },
    { lv:3,  ad:'Elit III',  hp:48000,  top:39, direk:14, ep:200000,  img:'assets/elitship/elit3/images/1.png' },
    { lv:4,  ad:'Elit IV',   hp:62000,  top:43, direk:16, ep:380000,  img:'assets/elitship/elit4/images/1.png' },
    { lv:5,  ad:'Elit V',    hp:78000,  top:46, direk:18, ep:650000,  img:'assets/elitship/elit5/images/1.png' },
    { lv:6,  ad:'Elit VI',   hp:96000,  top:49, direk:20, ep:1050000, img:'assets/elitship/elit6/images/1.png' },
    { lv:7,  ad:'Elit VII',  hp:116000, top:52, direk:21, ep:1600000, img:'assets/elitship/elit7/images/1.png' },
    { lv:8,  ad:'Elit VIII', hp:138000, top:55, direk:23, ep:2300000, img:'assets/elitship/elit8/images/1.png' },
    { lv:9,  ad:'Elit IX',   hp:162000, top:57, direk:24, ep:3200000, img:'assets/elitship/elit9/images/1.png' },
    { lv:10, ad:'Elit X',    hp:190000, top:60, direk:25, ep:4500000, img:'assets/elitship/elit10/images/1.png' }
  ];

  function fmt(n){ return Number(n).toLocaleString('tr-TR'); }

  /* ── STORAGE (API bazlı) ── */
  const API_URL = 'http://localhost:3000/api';
  const token = localStorage.getItem('sp_token');

  if (!token) {
    window.location.href = 'index.html';
  }

  let currentEP  = 0;
  let activeShip = 0;
  let activeTab  = 'elit';

  async function loadShips() {
    try {
      const res = await fetch(`${API_URL}/ships`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        currentEP = parseInt(data.elitePoints) || 0;
        activeShip = parseInt(data.activeShipLevel) || 0;

        const saved = JSON.parse(localStorage.getItem('sp_player') || '{}');
        saved.elite_points = currentEP;
        saved.ship_level = activeShip;
        localStorage.setItem('sp_player', JSON.stringify(saved));

        renderEPBar();
        renderBanner();
        renderGrid();
      } else {
        toast('Gemi bilgileri yüklenemedi!', 'err');
      }
    } catch (err) {
      console.error(err);
      toast('Sunucuya bağlanılamadı!', 'err');
    }
  }

  /* ── EP BAR ── */
  function renderEPBar() {
    const next = GEMILER.find(g => g.ep > currentEP);
    document.getElementById('ep-val').textContent = fmt(currentEP) + ' ELP';
    if (next) {
      const pct = Math.min(100, (currentEP / next.ep) * 100);
      document.getElementById('ep-fill').style.width = pct + '%';
      document.getElementById('ep-next').textContent = 'Sonraki: ' + next.ad + ' — ' + fmt(next.ep) + ' ELP gerekli';
    } else {
      document.getElementById('ep-fill').style.width = '100%';
      document.getElementById('ep-next').textContent = 'Tüm gemiler açık!';
    }
  }

  /* ── ACTIVE BANNER ── */
  function renderBanner() {
    const g = GEMILER[activeShip];
    if (!g) return;
    document.getElementById('ab-img').src = g.img || '';
    document.getElementById('ab-name').textContent  = g.ad;
    document.getElementById('ab-level').textContent = 'Seviye ' + g.lv;
    document.getElementById('ab-hp').textContent    = fmt(g.hp);
    document.getElementById('ab-top').textContent   = g.top + ' adet';
    document.getElementById('ab-direk').textContent = g.direk + ' adet';
  }

  /* ── GRID ── */
  function renderGrid() {
    const content = document.getElementById('tab-content');
    content.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'ship-grid';

    GEMILER.forEach(g => {
      const isActive   = g.lv === activeShip;
      const isUnlocked = g.ep <= currentEP;
      const isLocked   = !isUnlocked;

      const card = document.createElement('div');
      card.className = 'ship-card' + (isActive ? ' active-card' : '') + (isLocked ? ' locked' : '');

      let badgeClass, badgeText;
      if (isActive)        { badgeClass = 'badge-active'; badgeText = 'SEÇİLDİ'; }
      else if (isUnlocked) { badgeClass = 'badge-unlock'; badgeText = 'KULLAN'; }
      else                 { badgeClass = 'badge-locked'; badgeText = fmt(g.ep) + ' ELP'; }

      card.innerHTML = `
        ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
        <div class="card-img">
          ${g.img
            ? `<img src="${g.img}" alt="${g.ad}" onerror="this.parentElement.innerHTML='<span class=\\'ph\\'>${g.lv}</span>'"/>`
            : `<span class="ph">${g.lv}</span>`}
        </div>
        <div class="card-name">${g.ad}</div>
        <div class="card-stats">
          HP: ${fmt(g.hp)}<br/>
          Top: ${g.top}  ·  Direk: ${g.direk}
        </div>
        <span class="card-badge ${badgeClass}">${badgeText}</span>
      `;

      if (!isLocked) {
        card.addEventListener('click', () => selectShip(g.lv));
      }
      grid.appendChild(card);
    });

    content.appendChild(grid);
  }

  /* ── DESIGNS TAB ── */
  function renderDesigns() {
    const content = document.getElementById('tab-content');
    content.innerHTML = `
      <div class="designs-empty">
        <div class="de-ico">🚢</div>
        <div class="de-txt">Gemi tasarımları<br/>yakında eklenecek</div>
      </div>`;
  }

  /* ── SWITCH TAB ── */
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'elit') renderGrid();
    else renderDesigns();
  }

  /* ── SELECT SHIP ── */
  async function selectShip(lv) {
    if (lv === activeShip) { toast(GEMILER[lv].ad + ' zaten kullanılıyor.', 'err'); return; }
    if (GEMILER[lv].ep > currentEP) { toast('Yetersiz Elit Puan!', 'err'); return; }
    
    try {
      const res = await fetch(`${API_URL}/ships/select`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ level: lv })
      });

      const data = await res.json();
      if (!res.ok) {
        toast(data.error || 'Gemi seçimi başarısız!', 'err');
        return;
      }

      toast(GEMILER[lv].ad + ' aktif edildi ✅', 'ok');
      await loadShips();
    } catch (err) {
      console.error(err);
      toast('Sunucuya bağlanılamadı!', 'err');
    }
  }

  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast ' + type;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  /* ── INIT ── */
  loadShips();
</script>
</body>
</html>
