<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover"/>
  <meta name="theme-color" content="#080502">
  <style>body { visibility: hidden; background: #080502; }</style>
  <title>SeaPirates — Ships</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <script src="js/lang.js?v=2"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/logger.js"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="transition.js?v=5"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#c8962a;--gold-b:#f0c040;--gold-p:#fde68a;
      --wood-d:#0f0a05;--wood-m:#1a1108;
      --txt:#f5e6c8;--txt-d:#b8956a;--txt-m:#7a5a38;
    }
    html,body{
      width:100%;height:100dvh;overflow:hidden;
      background:#080502;font-family:'Inter',sans-serif;color:var(--txt);
    }
    .page{
      max-width:430px;margin:0 auto;height:100dvh;
      display:flex;flex-direction:column;position:relative;
      background:url('assets/ui/background/shipsbackground.png') center/cover no-repeat;
    
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
    }
    .page::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.70);pointer-events:none;z-index:0;}

    /* ── TOP BAR ── */
    .top-bar{
      position:relative;z-index:10;flex-shrink:0;padding:14px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(200,150,42,0.3);
      background:linear-gradient(180deg,rgba(20,10,2,0.98),rgba(10,5,0,0.9));
    }
    .btn-back{
      padding:8px 12px;background:linear-gradient(180deg,#3d2108,#1e0e03);
      border:1px solid #7a4a18;border-radius:7px;
      font-family:'Cinzel',serif;font-size:0.7rem;font-weight:700;
      color:var(--txt-d);text-decoration:none;transition:all 0.2s;
    }
    .btn-back:hover{border-color:var(--gold);color:var(--gold-b);}
    .page-title{
      font-family:'Cinzel',serif;font-weight:900;font-size:1.1rem;
      letter-spacing:0.1em;color:var(--gold-b);
      text-shadow:0 0 12px rgba(200,150,42,0.7);text-transform:uppercase;
    }

    /* ── BODY ── */
    .body{flex:1;position:relative;z-index:5;display:flex;flex-direction:column;overflow:hidden;}

    /* ── EP PROGRESS BAR ── */
    .ep-section{
      flex-shrink:0;padding:12px 16px;
      background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(200,150,42,0.15);
    }
    .ep-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
    .ep-lbl{font-size:0.65rem;font-weight:600;color:var(--txt-m);text-transform:uppercase;letter-spacing:0.06em;}
    .ep-val{font-size:0.75rem;font-weight:700;color:var(--gold-b);}
    .ep-track{
      height:9px;background:rgba(0,0,0,0.6);border-radius:5px;overflow:hidden;
      border:1px solid rgba(200,150,42,0.15);
    }
    .ep-fill{
      height:100%;border-radius:4px;
      background:linear-gradient(90deg,#5c3518,var(--gold-b));
      transition:width 0.6s ease;
    }
    .ep-next{font-size:0.58rem;color:var(--txt-m);margin-top:4px;text-align:right;overflow-wrap:break-word;word-break:break-word;}

    /* ── ACTIVE SHIP BANNER ── */
    .active-banner{
      flex-shrink:0;margin:12px 14px;padding:14px;
      background:url('assets/ui/background/shippanel.png') center/cover;
      border:2px solid var(--gold);border-radius:12px;
      display:flex;align-items:center;gap:14px;
      box-shadow:0 0 20px rgba(200,150,42,0.15), 0 6px 15px rgba(0,0,0,0.6);
      position:relative;overflow:hidden;
    }
    .active-banner::before{
      content:'';position:absolute;top:8px;right:10px;
      font-family:'Cinzel',serif;font-size:0.55rem;font-weight:700;
      color:var(--gold);letter-spacing:0.1em;opacity:0.7;
    }
    .ab-img{
      width:80px;height:80px;flex-shrink:0;
      background:rgba(0,0,0,0.3);border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(200,150,42,0.2);
      overflow:hidden;
    }
    .ab-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px #000);}
    .ab-info{flex:1;}
    .ab-name{font-family:'Cinzel',serif;font-size:1rem;font-weight:900;color:var(--gold-p);margin-bottom:2px;overflow-wrap:break-word;word-break:break-word;}
    .ab-level{font-size:0.65rem;color:var(--txt-m);margin-bottom:8px;overflow-wrap:break-word;word-break:break-word;}
    .ab-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
    .ab-stat{
      background:rgba(0,0,0,0.3);border-radius:5px;padding:5px 7px;
      display:flex;flex-direction:column;gap:1px;
    }
    .ab-stat-k{font-size:0.55rem;color:var(--txt-m);text-transform:uppercase;overflow-wrap:break-word;word-break:break-word;}
    .ab-stat-v{font-size:0.78rem;font-weight:700;color:var(--txt);overflow-wrap:break-word;word-break:break-word;}

    /* ── TAB BAR ── */
    .tab-bar{
      flex-shrink:0;display:flex;padding:0 14px;gap:8px;
      background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(200,150,42,0.12);
    }
    .tab-btn{
      padding:10px 16px;background:transparent;border:none;border-bottom:2px solid transparent;
      font-family:'Cinzel',serif;font-size:0.72rem;font-weight:700;
      color:var(--txt-m);cursor:pointer;transition:all 0.2s;
    }
    .tab-btn.active{color:var(--gold-b);border-bottom:2px solid var(--gold);}

    /* ── SHIP GRID ── */
    .ship-grid{
      flex:1;overflow-y:auto;padding:14px;
      display:grid;grid-template-columns:1fr 1fr;gap:10px;
      align-content:start;
    }
    .ship-grid::-webkit-scrollbar{width:4px;}
    .ship-grid::-webkit-scrollbar-thumb{background:#442a10;border-radius:2px;}

    .ship-card{
      border-radius:10px;padding:12px 10px;cursor:pointer;position:relative;
      background:url('assets/ui/background/shippanel.png') center/cover;
      border:1.5px solid rgba(200,150,42,0.1);
      display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
      transition:all 0.2s;box-shadow:0 4px 10px rgba(0,0,0,0.5);
    }
    .ship-card:hover:not(.locked){
      border-color:rgba(200,150,42,0.5);
      box-shadow:0 6px 18px rgba(200,150,42,0.12);
      transform:translateY(-2px);
    }
    .ship-card.active-card{
      border-color:var(--gold);
      box-shadow:0 0 15px rgba(200,150,42,0.2),0 4px 10px rgba(0,0,0,0.5);
    }
    .ship-card.locked{opacity:0.5;cursor:default;}

    .card-img{
      width:70px;height:70px;
      background:rgba(0,0,0,0.3);border-radius:7px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(200,150,42,0.1);overflow:hidden;
    }
    .card-img img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 3px 8px #000) brightness(1.6) saturate(1.5) contrast(1.1);}
    .card-img .ph{font-size:1.5rem;font-weight:700;color:var(--gold);opacity:0.35;}

    .card-name{font-family:'Cinzel',serif;font-size:0.68rem;font-weight:700;color:var(--txt);line-height:1.2;overflow-wrap:break-word;word-break:break-word;}
    .card-stats{font-size:0.6rem;color:var(--txt-d);line-height:1.5;overflow-wrap:break-word;word-break:break-word;}
    .card-actions{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;justify-content:center;}
    .card-action-btn{
      padding:3px 10px;border-radius:4px;
      font-family:'Cinzel',serif;font-size:0.55rem;font-weight:700;
      background:rgba(200,150,42,0.1);border:1px solid rgba(200,150,42,0.3);
      color:var(--gold-b);cursor:pointer;transition:all 0.2s;
    }
    .card-action-btn:hover{border-color:var(--gold);color:var(--gold-p);background:rgba(200,150,42,0.2);}
    .card-action-btn.active-visual{
      background:rgba(100,200,255,0.15);border-color:rgba(100,200,255,0.4);
      color:#8ac8ff;
    }

    .card-badge{
      padding:3px 10px;border-radius:4px;
      font-family:'Cinzel',serif;font-size:0.58rem;font-weight:700;
      display:inline-block;
    }
    .badge-active{background:var(--gold);color:#1a0e05;}
    .badge-unlock{background:rgba(200,150,42,0.1);border:1px solid rgba(200,150,42,0.3);color:var(--gold-b);}
    .badge-locked{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);color:var(--txt-m);}

    .lock-icon{
      position:absolute;top:8px;right:8px;font-size:0.9rem;opacity:0.6;
    }

  </style>
</head>
<body>


<div class="page">
  <div class="top-bar">
    <a href="menu.html" class="btn-back"><span data-i18n="btn_back" data-i18n-text>◀ GERİ</span></a>
    <div class="page-title"><span data-i18n="page_ships" data-i18n-text>GEMİLER</span></div>
    <div style="width:65px;"></div>
  </div>

  <div class="body">
    <!-- EP Progress -->
    <div class="ep-section">
      <div class="ep-row">
        <span class="ep-lbl" data-i18n="ships_ep_label">💎 Elite Points (ELP)</span>
        <span class="ep-val" id="ep-val">0</span>
      </div>
      <div class="ep-track"><div class="ep-fill" id="ep-fill" style="width:0%"></div></div>
      <div class="ep-next" id="ep-next">Next: Elite I — 35,000 ELP needed</div>
    </div>

    <!-- Active Ship Banner -->
    <div class="active-banner" id="active-banner">
      <div class="ab-img"><img id="ab-img" src="" alt=""/></div>
      <div class="ab-info">
        <div class="ab-name" id="ab-name">—</div>
        <div class="ab-level" id="ab-level">Seviye 0</div>
        <div class="ab-visual" id="ab-visual" style="font-size:0.6rem;color:var(--txt-m);margin-bottom:6px;"></div>
        <div class="ab-stats">
          <div class="ab-stat"><span class="ab-stat-k" data-i18n="ships_hp_short">HP</span><span class="ab-stat-v" id="ab-hp">—</span></div>
          <div class="ab-stat"><span class="ab-stat-k" data-i18n="ships_cannon_slots">Cannon Slots</span><span class="ab-stat-v" id="ab-top">—</span></div>
          <div class="ab-stat"><span class="ab-stat-k" data-i18n="ships_mast_slots">Mast Slots</span><span class="ab-stat-v" id="ab-direk">—</span></div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-elit" data-i18n="ships_tab_elite" onclick="switchTab('elit')">ELITE SHIPS</button>
      <button class="tab-btn" id="tab-tasarim" data-i18n="ships_tab_designs" onclick="switchTab('tasarim')">DESIGNS</button>
    </div>

    <!-- Grid / Content -->
    <div id="tab-content" style="flex:1;overflow:hidden;display:flex;flex-direction:column;"></div>
  </div>
</div>

<script>
  /* ── GDD VERİSİ ── */
  const GEMILER = [
    { lv:0,  ad:'Starter', hp:10000,  top:15, direk:5,  ep:0,       img:'assets/ships/elitship/default/1.png' },
    { lv:1,  ad:'Elite I',    hp:25000,  top:30, direk:10, ep:35000,   img:'assets/ships/elitship/elit1/images/1.png' },
    { lv:2,  ad:'Elite II',   hp:36000,  top:35, direk:12, ep:90000,   img:'assets/ships/elitship/elit2/images/1.png' },
    { lv:3,  ad:'Elite III',  hp:48000,  top:39, direk:14, ep:200000,  img:'assets/ships/elitship/elit3/images/1.png' },
    { lv:4,  ad:'Elite IV',   hp:62000,  top:43, direk:16, ep:380000,  img:'assets/ships/elitship/elit4/images/1.png' },
    { lv:5,  ad:'Elite V',    hp:78000,  top:46, direk:18, ep:650000,  img:'assets/ships/elitship/elit5/images/1.png' },
    { lv:6,  ad:'Elite VI',   hp:96000,  top:49, direk:20, ep:1050000, img:'assets/ships/elitship/elit6/images/1.png' },
    { lv:7,  ad:'Elite VII',  hp:116000, top:52, direk:21, ep:1600000, img:'assets/ships/elitship/elit7/images/1.png' },
    { lv:8,  ad:'Elite VIII', hp:138000, top:55, direk:23, ep:2300000, img:'assets/ships/elitship/elit8/images/1.png' },
    { lv:9,  ad:'Elite IX',   hp:162000, top:57, direk:24, ep:3200000, img:'assets/ships/elitship/elit9/images/1.png' },
    { lv:10, ad:'Elite X',    hp:190000, top:60, direk:25, ep:4500000, img:'assets/ships/elitship/elit10/images/1.png' }
  ];

  function fmt(n){ return Number(n).toLocaleString('en-US'); }

  /* ── STORAGE (API bazlı) ── */
  const API_URL = (window.__API_URL__ || window.location.origin) + '/api';
  const token = localStorage.getItem('sp_token');

  if (!token) {
    goTo('index.html');
  }

  let currentEP  = 0;
  let activeShip = 0;
  let hasEliteShip = false;
  let activeTab  = 'elit';
  let visualShipLevel = null;

  async function loadShips() {
    try {
      const res = await fetch(`${API_URL}/ships`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        currentEP = parseInt(data.elitePoints) || 0;
        activeShip = parseInt(data.activeShipLevel) || 0;
        visualShipLevel = data.visualShipLevel != null ? parseInt(data.visualShipLevel) : null;
        hasEliteShip = data.hasEliteShip === true;
        ownedDesigns = data.ownedDesigns || [];
        activeDesign = data.activeDesign || null;

        const saved = JSON.parse(localStorage.getItem('sp_player') || '{}');
        saved.elite_points = currentEP;
        saved.ship_level = activeShip;
        saved.visual_ship_level = visualShipLevel;
        localStorage.setItem('sp_player', JSON.stringify(saved));

        renderEPBar();
        renderBanner();
        if (activeTab === 'elit') renderGrid();
        else renderDesigns();
      } else {
        toast(t('ships_load_failed'), 'err');
      }
    } catch (err) {
      logError('ships:load-ships', err);
      toast(t('connection_failed'), 'err');
    }
  }

  function renderEPBar() {
    const next = GEMILER.find(g => g.ep > currentEP);
    document.getElementById('ep-val').textContent = fmt(currentEP) + ' ' + t('ships_ep_short');
    if (next) {
      const pct = Math.min(100, (currentEP / next.ep) * 100);
      document.getElementById('ep-fill').style.width = pct + '%';
      document.getElementById('ep-next').textContent = t('ships_elite_next', { name: t(next.ad), amount: fmt(next.ep) });
    } else {
      document.getElementById('ep-fill').style.width = '100%';
      document.getElementById('ep-next').textContent = t('ships_all_unlocked');
    }
  }

  /* ── ACTIVE BANNER ── */
  function renderBanner() {
    const g = GEMILER[activeShip];
    if (!g) return;

    const visualLvl = (visualShipLevel != null && visualShipLevel >= 0) ? visualShipLevel : activeShip;
    const gVis = GEMILER[visualLvl] || g;

    const design = TASARIMLAR.find(d => d.key === activeDesign);
    document.getElementById('ab-img').src = design ? design.img : (gVis.img || '');
    document.getElementById('ab-name').textContent  = t(g.ad);
    let levelText = t('ships_level') + ' ' + g.lv + (design ? ' [' + design.name + ']' : ' [' + t('ships_default') + ']');
    if (visualLvl !== activeShip) {
      levelText += ' (' + t('ships_visual') + ': ' + t(GEMILER[visualLvl].ad) + ')';
    }
    document.getElementById('ab-level').textContent = levelText;
    document.getElementById('ab-hp').textContent    = fmt(g.hp);
    document.getElementById('ab-top').textContent   = g.top + ' ' + t('equip_pcs');
    document.getElementById('ab-direk').textContent = g.direk + ' ' + t('equip_pcs');
  }

  /* ── GRID ── */
  function renderGrid() {
    const content = document.getElementById('tab-content');
    content.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'ship-grid';

    GEMILER.forEach(g => {
      const isActive = g.lv === activeShip;
      const isUnlocked = g.lv === 0 ? true : (g.lv === 1 ? (hasEliteShip || g.ep <= currentEP) : (hasEliteShip && g.ep <= currentEP));
      const isLocked = !isUnlocked;
      const isVisual = g.lv === visualShipLevel && !isActive;

      const card = document.createElement('div');
      card.className = 'ship-card' + (isActive ? ' active-card' : '') + (isLocked ? ' locked' : '');

      let badgeClass, badgeText;
      if (isActive)        { badgeClass = 'badge-active'; badgeText = t('ships_badge_selected'); }
      else if (isUnlocked) { badgeClass = 'badge-unlock'; badgeText = t('ships_badge_use'); }
      else                 { badgeClass = 'badge-locked'; badgeText = fmt(g.ep) + ' ' + t('ships_ep_short'); }

      let actionsHtml = '';
      if (!isLocked) {
        const canUseVisual = g.lv < activeShip || (isActive && visualShipLevel != null);
        if (canUseVisual && !isActive) {
          const visClass = isVisual ? 'active-visual' : '';
          actionsHtml += `<span class="card-action-btn ${visClass}" data-visual="${g.lv}">${t('ships_visual')}</span>`;
        }
        if (isActive && visualShipLevel != null) {
          actionsHtml += `<span class="card-action-btn" data-reset-visual="1">${t('ships_default_view')}</span>`;
        }
      }

      card.innerHTML = `
        ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
        <div class="card-img">
          ${g.img
            ? `<img src="${g.img}" alt="${t(g.ad)}" onerror="this.parentElement.innerHTML='<span class=\\'ph\\'>${g.lv}</span>'"/>`
            : `<span class="ph">${g.lv}</span>`}
        </div>
        <div class="card-name">${t(g.ad)}</div>
        <div class="card-stats">
          ${t('ships_hp_short')}: ${fmt(g.hp)}<br/>
          ${t('ships_cannon_slots')}: ${g.top}  ·  ${t('ships_mast_slots')}: ${g.direk}
        </div>
        <span class="card-badge ${badgeClass}">${badgeText}</span>
        ${actionsHtml ? `<div class="card-actions">${actionsHtml}</div>` : ''}
      `;

      if (!isLocked) {
        card.addEventListener('click', (e) => {
          if (e.target.dataset.visual !== undefined) {
            selectVisual(parseInt(e.target.dataset.visual));
          } else if (e.target.dataset.resetVisual !== undefined) {
            selectVisual(activeShip);
          } else {
            selectShip(g.lv);
          }
        });
      }
      grid.appendChild(card);
    });

    content.appendChild(grid);
  }

  /* ── DESIGNS TAB ── */
  const TASARIMLAR = [
    { key: 'kristal_queen', nk: 'design_crystal_queen', name: 'Crystal Queen', img: 'assets/items/shop/kristalquen/1.png' },
    { key: 'seahawk', nk: 'design_seahawk', name: 'Seahawk', img: 'assets/items/shop/seahawk/1.png' }
  ];

  let ownedDesigns = [];
  let activeDesign = null;

  function renderDesigns() {
    const content = document.getElementById('tab-content');
    content.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'ship-grid';

    TASARIMLAR.forEach(design => {
      const isOwned = ownedDesigns.includes(design.key);
      const isActive = design.key === activeDesign;

      const card = document.createElement('div');
      card.className = 'ship-card' + (isActive ? ' active-card' : '') + (!isOwned ? ' locked' : '');

      let badgeClass, badgeText;
      if (isActive) { badgeClass = 'badge-active'; badgeText = t('ships_badge_selected'); }
      else if (isOwned) { badgeClass = 'badge-unlock'; badgeText = t('ships_badge_use'); }
      else { badgeClass = 'badge-locked'; badgeText = t('ships_locked'); }

      card.innerHTML = `
        ${!isOwned ? '<div class="lock-icon">🔒</div>' : ''}
        <div class="card-img">
          <img src="${design.img}" alt="${design.nk ? t(design.nk) : design.name}" onerror="this.parentElement.innerHTML='<span class=\\'ph\\'>✦</span>'"/>
        </div>
        <div class="card-name">${design.nk ? t(design.nk) : design.name}</div>
        <div class="card-stats">${t('ships_cosmetic')}</div>
        <span class="card-badge ${badgeClass}">${badgeText}</span>
      `;

      if (isOwned) {
        card.addEventListener('click', () => {
          if (isActive) selectDesign(null);
          else selectDesign(design.key);
        });
      }
      grid.appendChild(card);
    });

    content.appendChild(grid);
  }

  async function selectDesign(key) {
    try {
      const res = await fetch(`${API_URL}/ships/select-design`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ designKey: key })
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Hata!', 'err'); return; }
      activeDesign = key;
      renderDesigns();
      renderBanner();
    } catch (err) {
      logError('ships:load', err);
        toast(t('connection_failed'), 'err');
    }
  }

  /* ── SWITCH TAB ── */
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'elit') renderGrid();
    else renderDesigns();
  }

  /* ── SELECT SHIP ── */
  async function selectShip(lv) {
    if (lv === activeShip) { return; }
    if (lv > 1 && GEMILER[lv].ep > currentEP) { toast(t('ships_insufficient_ep'), 'err'); return; }
    
    try {
      const res = await fetch(`${API_URL}/ships/select`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ level: lv })
      });

      const data = await res.json();
      if (!res.ok) {
        toast(data.error || 'Ship selection failed!', 'err');
        return;
      }

      await loadShips();
    } catch (err) {
      logError('ships:select-ship', err);
      toast('Could not connect to server!', 'err');
    }
  }

  /* ── SELECT VISUAL ── */
  async function selectVisual(lv) {
    try {
      const res = await fetch(`${API_URL}/ships/select-visual`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ visualLevel: lv })
      });

      const data = await res.json();
      if (!res.ok) {
        toast(data.error || 'Visual selection failed!', 'err');
        return;
      }

      visualShipLevel = data.visualShipLevel;
      renderBanner();
      renderGrid();
    } catch (err) {
      logError('ships:select-visual', err);
      toast('Could not connect to server!', 'err');
    }
  }

  function toast(msg, type) {
    window.showAlert(msg, type === 'err' ? t('server_error') : 'SEAPIRATES', type === 'err');
  }

  /* ── INIT ── */
  loadShips();
</script>
 <script>revealPage();</script>
</body>
</html>
