<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Account - SeaPirates</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e1a; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.card { background: linear-gradient(145deg, #141b2b, #1a2332); border: 1px solid #2a3a5c; border-radius: 12px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
h1 { color: #ff6b6b; font-size: 24px; margin-bottom: 8px; text-align: center; }
p.desc { color: #8892a8; text-align: center; margin-bottom: 24px; font-size: 14px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; color: #a0aaba; margin-bottom: 4px; }
input { width: 100%; padding: 10px 12px; background: #0d1321; border: 1px solid #2a3a5c; border-radius: 6px; color: #e0e0e0; font-size: 14px; }
input:focus { outline: none; border-color: #4a7aff; }
.btn { width: 100%; padding: 12px; background: linear-gradient(180deg, #c0392b, #96281b); border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: #ff6b6b; font-size: 13px; margin-top: 8px; display: none; }
.success { color: #2ecc71; font-size: 13px; margin-top: 8px; display: none; text-align: center; }
.back-link { display: block; text-align: center; margin-top: 16px; color: #4a7aff; text-decoration: none; font-size: 13px; }
.back-link:hover { text-decoration: underline; }
.lang-switch { text-align: right; margin-bottom: 16px; }
.lang-switch a { color: #8892a8; text-decoration: none; font-size: 12px; cursor: pointer; }
.lang-switch a:hover { color: #e0e0e0; }
</style>
</head>
<body>
<div class="card">
  <div class="lang-switch">
    <a onclick="setLang('en')">English</a> | <a onclick="setLang('tr')">Türkçe</a>
  </div>
  <h1 id="title">Delete Account</h1>
  <p class="desc" id="desc">Enter your credentials to permanently delete your account and all associated data. This action cannot be undone.</p>
  <form id="deleteForm">
    <div class="form-group">
      <label for="username" id="lbl-username">Username</label>
      <input type="text" id="username" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password" id="lbl-password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn-submit">DELETE MY ACCOUNT</button>
    <div class="error" id="error-msg"></div>
    <div class="success" id="success-msg">Your account has been deleted.</div>
  </form>
  <a class="back-link" href="index.html" id="back-link">← Back to Game</a>
</div>

<script>
const LANG = {
  en: {
    title: 'Delete Account',
    desc: 'Enter your credentials to permanently delete your account and all associated data. This action cannot be undone.',
    lbl_username: 'Username',
    lbl_password: 'Password',
    btn: 'DELETE MY ACCOUNT',
    success: 'Your account has been deleted. Thank you for playing SeaPirates.',
    error_generic: 'Failed to delete account. Please check your credentials.',
    back: '← Back to Game'
  },
  tr: {
    title: 'Hesabı Sil',
    desc: 'Hesabınızı ve tüm verilerinizi kalıcı olarak silmek için bilgilerinizi girin. Bu işlem geri alınamaz.',
    lbl_username: 'Kullanıcı Adı',
    lbl_password: 'Şifre',
    btn: 'HESABIMI SİL',
    success: 'Hesabınız silindi. SeaPirates oynadığınız için teşekkürler.',
    error_generic: 'Hesap silinemedi. Bilgilerinizi kontrol edin.',
    back: '← Oyuna Dön'
  }
};

let currentLang = 'en';
const API_URL = (window.__API_URL__ || window.location.origin) + '/api/auth';

function setLang(lang) {
  currentLang = lang;
  const t = LANG[lang];
  document.getElementById('title').textContent = t.title;
  document.getElementById('desc').textContent = t.desc;
  document.getElementById('lbl-username').textContent = t.lbl_username;
  document.getElementById('lbl-password').textContent = t.lbl_password;
  document.getElementById('btn-submit').textContent = t.btn;
  document.getElementById('success-msg').textContent = t.success;
  document.getElementById('back-link').textContent = t.back;
}

document.getElementById('deleteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  const errEl = document.getElementById('error-msg');
  const successEl = document.getElementById('success-msg');
  errEl.style.display = 'none';
  successEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '...';

  try {
    // First login
    const loginRes = await fetch(API_URL.replace('/auth', '/auth/login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const loginData = await loginRes.json();

    if (!loginRes.ok || !loginData.data || !loginData.data.token) {
      errEl.textContent = currentLang === 'tr' ? 'Kullanıcı adı veya şifre hatalı.' : 'Invalid username or password.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = LANG[currentLang].btn;
      return;
    }

    const token = loginData.data.token;

    // Delete account
    const delRes = await fetch(API_URL + '/delete-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const delData = await delRes.json();

    if (!delRes.ok || delData.error) {
      errEl.textContent = LANG[currentLang].error_generic;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = LANG[currentLang].btn;
      return;
    }

    successEl.style.display = 'block';
    document.getElementById('deleteForm').style.display = 'none';
  } catch (err) {
    errEl.textContent = LANG[currentLang].error_generic;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = LANG[currentLang].btn;
  }
});
</script>
</body>
</html>
