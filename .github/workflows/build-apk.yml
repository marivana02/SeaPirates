name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL (boş bırakılırsa capacitor.config.json kullanılır)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Install Capacitor
        run: |
          cd frontend
          npm install
          npx cap --version

      - name: Set server URL in config
        run: |
          URL="${{ github.event.inputs.server_url }}"
          if [ -z "$URL" ]; then
            echo "Using URL from capacitor.config.json"
          else
            echo "Using server URL: $URL"
            cd frontend
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              const isHttps = '$URL'.startsWith('https://');
              cfg.server.url = '$URL';
              cfg.server.androidScheme = isHttps ? 'https' : 'http';
              cfg.server.cleartext = !isHttps;
              cfg.appId = 'com.seapirates.app';
              cfg.appName = 'SeaPirates';
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
          fi

      - name: Copy frontend to www
        run: |
          cd frontend
          rm -rf www
          mkdir -p www
          # Tüm frontend dosyalarını www/ altına kopyala (js/, assets/ alt dizinleri dahil)
          cp -r *.html *.js *.css js/ assets/ effects/ manifest.json sw.js www/
          ls -la www/

      - name: Add Android platform
        run: |
          cd frontend
          ls -la
          npx cap add android
          ls -la android/

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Enable cleartext traffic in AndroidManifest
        run: |
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          if grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            echo "usesCleartextTraffic already set"
          else
            echo "Adding android:usesCleartextTraffic=\"true\" to <application>"
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
            grep 'usesCleartextTraffic' "$MANIFEST"
          fi

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaPirates-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
