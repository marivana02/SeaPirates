name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL (boş = http://192.168.1.5:3000)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Install Capacitor
        run: |
          cd frontend
          npm install
          npx cap --version

      - name: Copy frontend to www and create config
        run: |
          URL="${{ github.event.inputs.server_url }}"
          if [ -z "$URL" ]; then
            URL="http://192.168.1.5:3000"
            echo "Using default URL: $URL"
          else
            echo "Using server URL: $URL"
          fi

          cd frontend
          rm -rf www
          mkdir -p www/js
          cp -r *.html *.js *.css js/ assets/ effects/ manifest.json sw.js www/
          echo "window.__API_URL__ = '$URL';" > www/js/config.js

      - name: Add Android platform
        run: |
          cd frontend
          npx cap add android

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Enable cleartext traffic in AndroidManifest
        run: |
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          if grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            echo "usesCleartextTraffic already set"
          else
            echo "Adding android:usesCleartextTraffic=\"true\" to <application>"
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
            grep 'usesCleartextTraffic' "$MANIFEST"
          fi

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaPirates-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
