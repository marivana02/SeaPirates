name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL (örn. http://192.168.1.3:3000)'
        required: false
        default: 'http://192.168.1.100:3000'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools cmdline-tools.zip
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1

      - name: Install Capacitor
        run: |
          cd frontend
          npm install
          npx cap --version

      - name: Set server URL in config
        run: |
          URL="${{ secrets.SERVER || github.event.inputs.server_url || 'http://192.168.1.100:3000' }}"
          echo "Using server URL: $URL"
          cd frontend
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server.url = '$URL';
            cfg.appId = 'com.seapirates.app';
            cfg.appName = 'SeaPirates';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          "

      - name: Add Android platform
        run: |
          cd frontend
          ls -la
          npx cap add android
          ls -la android/

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Build APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME not found"
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaPirates-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
