name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL (örn. http://192.168.1.3:3000)'
        required: true
        default: 'http://192.168.1.100:3000'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          cd frontend
          npm install

      - name: Set server URL
        run: |
          cd frontend
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server.url = '${{ secrets.SERVER || github.event.inputs.server_url }}';
            cfg.appId = 'com.seapirates.app';
            cfg.appName = 'SeaPirates';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            console.log('Server URL set to: ' + cfg.server.url);
          "

      - name: Add Android platform
        run: |
          cd frontend
          npx cap add android

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ANDROID_HOME=$ANDROID_HOME ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaPirates-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
