name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL (boş = http://192.168.1.5:3000)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Install Capacitor
        run: |
          cd frontend
          npm install
          npx cap --version

      - name: Copy frontend to www and create config
        run: |
          URL="${{ github.event.inputs.server_url }}"
          if [ -z "$URL" ]; then
            URL="http://192.168.1.5:3000"
            echo "Using default URL: $URL"
          else
            echo "Using server URL: $URL"
          fi

          cd frontend
          rm -rf www
          mkdir -p www/js
          cp -r *.html *.js *.css js/ assets/ effects/ manifest.json sw.js www/
          echo "window.__API_URL__ = '$URL';" > www/js/config.js

          # Ana JS dosyalarinin basina __API_URL__ fallback ekle (tum sayfalarda gecerli olsun)
          for f in www/js/api.js www/js/map.js www/js/fight-shared.js www/js/fight-pvp.js; do
            if [ -f "$f" ]; then
              echo "window.__API_URL__ = window.__API_URL__ || '$URL';" > www/api_temp.js
              cat "$f" >> www/api_temp.js
              mv www/api_temp.js "$f"
            fi
          done

      - name: Add Android platform
        run: |
          cd frontend
          npx cap add android

      - name: Generate app icons from login.png
        run: |
          SRC="frontend/assets/ui/login.png"
          ANDROID_RES="frontend/android/app/src/main/res"
          echo "Generating icons from $SRC ..."
          if [ ! -f "$SRC" ]; then exit 1; fi
          # Install imagemagick
          if ! command -v convert &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          # Generate each Android mipmap density (icon + round icon)
          for SIZE in 48 72 96 144 192; do
            case $SIZE in
              48)  DENSITY="mdpi" ;;
              72)  DENSITY="hdpi" ;;
              96)  DENSITY="xhdpi" ;;
              144) DENSITY="xxhdpi" ;;
              192) DENSITY="xxxhdpi" ;;
            esac
            OUT_DIR="$ANDROID_RES/mipmap-${DENSITY}"
            mkdir -p "$OUT_DIR"
            convert "$SRC" -gravity center -extent 1:1 -resize ${SIZE}x${SIZE} "$OUT_DIR/ic_launcher.png"
            cp "$OUT_DIR/ic_launcher.png" "$OUT_DIR/ic_launcher_round.png"
            echo "  $DENSITY → ${SIZE}x${SIZE}"
          done
          # Adaptive icon support (Android 8+) — use same icon as fallback
          ADAPTIVE_DIR="$ANDROID_RES/mipmap-anydpi-v26"
          mkdir -p "$ADAPTIVE_DIR"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > "$ADAPTIVE_DIR/ic_launcher.xml"
          cp "$ADAPTIVE_DIR/ic_launcher.xml" "$ADAPTIVE_DIR/ic_launcher_round.xml"
          # Generate foreground (icon art) and background (solid color)
          convert "$SRC" -gravity center -extent 1:1 -resize 108x108 "$ANDROID_RES/mipmap-anydpi-v26/ic_launcher_foreground.png"
          # Extract dominant background color from image edge
          BG_COLOR=$(convert "$SRC" -gravity center -extent 1:1 -resize 1x1 -format "%[hex:u.p{0,0}]" info:- 2>/dev/null || echo "1a0a00")
          convert -size 108x108 "xc:#${BG_COLOR}" "$ANDROID_RES/mipmap-anydpi-v26/ic_launcher_background.png"
          echo "  Adaptive icons created (foreground + background #${BG_COLOR})"
          # Play Store icon
          convert "$SRC" -gravity center -extent 1:1 -resize 512x512 frontend/playstore-icon.png
          echo "  playstore-icon.png → 512x512"

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Disable WebView state restoration (APK kill = fresh start)
        run: |
          MAIN_ACTIVITY="frontend/android/app/src/main/java/com/seapirates/app/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            sed -i 's/super.onCreate(savedInstanceState)/super.onCreate(null)/' "$MAIN_ACTIVITY"
            echo "Patched MainActivity.java: onCreate(null) → state restoration disabled"
          else
            echo "MainActivity.java not found!"
            find frontend/android -name "MainActivity.java"
          fi

      - name: Enable cleartext traffic in AndroidManifest
        run: |
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          if grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            echo "usesCleartextTraffic already set"
          else
            echo "Adding android:usesCleartextTraffic=\"true\" to <application>"
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
            grep 'usesCleartextTraffic' "$MANIFEST"
          fi

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaPirates-APK
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/playstore-icon.png
