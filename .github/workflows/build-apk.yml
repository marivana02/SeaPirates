name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL (boş = http://192.168.1.5:3000)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Install Capacitor
        run: |
          cd frontend
          npm install
          npx cap --version

      - name: Set server URL and inject config
        run: |
          URL="${{ github.event.inputs.server_url }}"
          if [ -z "$URL" ]; then
            URL="http://192.168.1.5:3000"
            echo "Using default URL: $URL"
          else
            echo "Using server URL: $URL"
          fi

          cd frontend
          # www/ dizinini oluştur ve frontend dosyalarını kopyala
          rm -rf www
          mkdir -p www/js
          cp -r *.html *.js *.css js/ assets/ effects/ manifest.json sw.js www/

          # Fallback icin www/config.js'ye server URL'ini yaz
          echo "window.__API_URL__ = '$URL';" > www/js/config.js

          # server.url olarak capacitor.config.json'a URL'i yaz
          sed -i "s|__SERVER_URL__|$URL|g" capacitor.config.json

          ls -la www/
          ls -la www/js/

      - name: Add Android platform
        run: |
          cd frontend
          ls -la
          npx cap add android
          ls -la android/

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Enable cleartext traffic (network config + manifest)
        run: |
          # Network Security Config — HttpURLConnection dahil tum cleartext trafigine izin ver
          RES_DIR="frontend/android/app/src/main/res/xml"
          mkdir -p "$RES_DIR"
          cat > "$RES_DIR/network_security_config.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # AndroidManifest'e networkSecurityConfig + usesCleartextTraffic ekle
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
            sed -i 's|<application|<application android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          grep -E 'networkSecurityConfig|usesCleartextTraffic' "$MANIFEST"

      - name: Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeaPirates-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
